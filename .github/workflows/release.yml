name: release

# Push a tag matching the pom version (e.g. v0.1.1) to publish the jar to
# GitHub Packages (Maven) and create a GitHub release with the artifacts.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Check tag matches pom version
        run: |
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pom version $version"; exit 1
          fi
      - name: Deploy to GitHub Packages
        run: mvn -B deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" target/*.jar --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
